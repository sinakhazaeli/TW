name: Build Traffic Whisperer Web

on:
  push:
    branches: [ main ]
    paths:
      - 'godot_source.zip'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GODOT_VERSION: '4.7.1'
      GODOT_TAG: '4.7.1-stable'
      PROJECT_DIR: 'build_source/TrafficWhisperer_Godot_M1'
      WEB_DIR: 'web_build'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip jq zip

      - name: Download Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(curl -fsSL \
            "https://api.github.com/repos/godotengine/godot-builds/releases/tags/${GODOT_TAG}")"

          EDITOR_URL="$(printf '%s' "$RELEASE_JSON" |
            jq -r '.assets[] |
            select(.name | test("linux\\.x86_64\\.zip$")) |
            .browser_download_url' |
            head -n1)"

          TEMPLATES_URL="$(printf '%s' "$RELEASE_JSON" |
            jq -r '.assets[] |
            select(.name | test("export_templates\\.tpz$")) |
            .browser_download_url' |
            head -n1)"

          curl -fL "$EDITOR_URL" -o godot.zip
          curl -fL "$TEMPLATES_URL" -o templates.tpz

          unzip -q godot.zip -d godot_bin

          GODOT_BIN="$(find godot_bin -maxdepth 1 \
            -type f -name 'Godot*' | head -n1)"

          chmod +x "$GODOT_BIN"
          sudo mv "$GODOT_BIN" /usr/local/bin/godot

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          unzip -q templates.tpz -d templates_unpacked

          TEMPLATE_SOURCE="$(find templates_unpacked \
            -type d -name 'templates' | head -n1)"

          cp -a "$TEMPLATE_SOURCE"/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          godot --version

      - name: Unpack Traffic Whisperer
        run: |
          set -euo pipefail

          rm -rf build_source web_build
          mkdir -p build_source web_build

          unzip -q godot_source.zip -d build_source

          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"

      - name: Import and validate Godot project
        run: |
          godot --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit

      - name: Export Web game
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/web"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-release Web \
            "web/index.html"

          cp -a "$PROJECT_DIR/web"/. "$WEB_DIR"/

          test -f "$WEB_DIR/index.html"
          test -n "$(find "$WEB_DIR" \
            -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find "$WEB_DIR" \
            -maxdepth 1 -name '*.pck' -print -quit)"

      - name: Add Netlify headers
        run: |
          cat > "$WEB_DIR/_headers" <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      - name: Create playable ZIP
        run: |
          cd "$WEB_DIR"
          zip -qr ../Traffic_Whisperer_Web.zip .

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: Traffic-Whisperer-Web
          path: Traffic_Whisperer_Web.zip
          retention-days: 30
